spring.application.name=JewelSoft

# H2 in-memory database (Data Layer)
spring.datasource.url=jdbc:h2:mem:jeweldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.h2.console.enabled=true

# JWT Secret (QA #7 - Security)
jwt.secret=JewelSoftSecretKey2024VeryLongSecretForHS256Algorithm
jwt.expiration=86400000

server.port=8080